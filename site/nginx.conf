server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Relative Location headers: behind the TLS ingress, absolute ones would point
  # at http://<host>:80.
  absolute_redirect off;

  # Personal-agent homepage (site/landing): the exact root and its /assets/ only.
  # try_files serves index.html in place; `index` would redirect internally to
  # /index.html, which the catch-all below 404s.
  location = / {
    limit_except GET { deny all; }
    try_files /index.html =404;
  }
  location /assets/ {
    try_files $uri =404;
  }

  # Open-source landing + docs (VitePress, base /opensource/, cleanUrls —
  # serve /foo from /foo.html and /foo/ from /foo/index.html).
  location = /opensource { return 301 /opensource/$is_args$args; }
  location /opensource/ {
    try_files $uri $uri.html $uri/index.html =404;
  }

  # Stable install URL — same bytes as /opensource/install.sh.
  location = /install.sh { alias /usr/share/nginx/html/opensource/install.sh; }
  location = /favicon.svg { alias /usr/share/nginx/html/opensource/favicon.svg; }
  location = /logo-mark.svg { alias /usr/share/nginx/html/opensource/logo-mark.svg; }
  location = /brand/machina-star.svg { alias /usr/share/nginx/html/opensource/brand/machina-star.svg; }
  location = /llms.txt { return 301 /opensource/llms.txt$is_args$args; }

  # The docs used to live under /docs/*, then at the root, then /open-source/*.
  # 301 all of them to /opensource/* so existing links, bookmarks, and search
  # results don't break. rewrite … permanent keeps the query string.
  location = /open-source { return 301 /opensource/$is_args$args; }
  location /open-source/ { rewrite ^/open-source/(.*)$ /opensource/$1 permanent; }
  location = /docs { return 301 /opensource/$is_args$args; }
  location /docs/ { rewrite ^/docs/(.*)$ /opensource/$1 permanent; }
  location ~ ^/((getting-started|core-concepts|building-bots|sports-data|deployment|advanced|machina|guide)(?:/.*)?|(?:cli-reference|hindsight-memory|contributing)(?:\.html)?)$ {
    rewrite ^/(.*)$ /opensource/$1 permanent;
  }

  # Everything else is a real 404 — no SPA fallback, no catch-all redirect.
  location / { return 404; }

  error_page 404 /opensource/404.html;
}
