# OpenShell policy — Athlete Vault, CONNECTED variant (Vault + read-only ESPN).
#
# Identical to policy.vault.yaml plus one deliberate exception: read-only
# HTTPS egress to the ESPN hosts the live cfb sports-skills need, for the
# Python skill interpreters only. This is NOT a private profile — public
# sports data leaves the box. Use policy.vault.yaml when nothing may.
#
# Keep the vault_* entries byte-identical to policy.vault.yaml
# (test/openshell-recipes.test.mjs enforces it).
#
# Attached provider profiles add their own endpoints to the effective policy
# (`openshell policy get <sandbox> --full`); a hosted inference provider adds
# public egress on top of this file.

version: 1

filesystem_policy:
  read_only:
    - /opt/venv
    - /app/dist
    - /app/node_modules
    - /app/skills-lock.json
  read_write:
    - /sandbox
    - /tmp
    - /app/.sportsclaw

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:

  vault_tail_bus:
    name: vault-tail-bus
    endpoints:
      - host: 172.17.0.1
        port: 8193
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /events
          - allow:
              method: POST
              path: /ingest
      - host: host.docker.internal
        port: 8193
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /events
          - allow:
              method: POST
              path: /ingest
    binaries:
      - path: /usr/local/bin/node

  vault_runtime_rest:
    name: vault-runtime-rest
    endpoints:
      - host: 172.17.0.1
        port: 5103
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /document/retrieve
          - allow:
              method: POST
              path: /document
          - allow:
              method: POST
              path: /document/search
          - allow:
              method: PUT
              path: /document/*
      - host: host.docker.internal
        port: 5103
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /document/retrieve
          - allow:
              method: POST
              path: /document
          - allow:
              method: POST
              path: /document/search
          - allow:
              method: PUT
              path: /document/*
    binaries:
      - path: /usr/local/bin/node

  vault_pod_mcp:
    name: vault-pod-mcp
    endpoints:
      - host: 172.17.0.1
        port: 8103
        path: /sse
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /sse
      - host: 172.17.0.1
        port: 8103
        path: /messages/
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /messages/
      - host: host.docker.internal
        port: 8103
        path: /sse
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: GET
              path: /sse
      - host: host.docker.internal
        port: 8103
        path: /messages/
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /messages/
    binaries:
      - path: /usr/local/bin/node

  espn:
    name: espn
    endpoints:
      - host: site.api.espn.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: site.web.api.espn.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: sports.core.api.espn.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: www.espn.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /opt/venv/bin/python3
      - path: /usr/bin/python3.11
