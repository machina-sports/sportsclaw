name: Scoped Relay Candidate

on:
  push:
    branches:
      - 'build/jev-relay-*'

permissions:
  contents: read

env:
  CANDIDATE_SHA: fb84d1f34b58d1dd5f2d4727d438309d608d282a
  APP_NAME: sportsclaw-relay

jobs:
  candidate:
    if: github.repository == 'machina-sports/sportsclaw'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Verify exact reviewed source
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build only the immutable candidate
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/relay/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SPORTSCLAW_BUILD_REVISION=${{ env.CANDIDATE_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.CANDIDATE_SHA }}
          tags: |
            ${{ secrets.REGISTRY_URL }}/${{ env.APP_NAME }}:candidate-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=relay-candidate
          cache-to: type=gha,scope=relay-candidate,mode=max
      - name: Record candidate identity
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          BUILD_RUN: ${{ github.run_id }}
        run: |
          python3 -c 'import json,os,re,pathlib; d=os.environ["DIGEST"]; s=os.environ["CANDIDATE_SHA"]; assert re.fullmatch(r"sha256:[0-9a-f]{64}",d); assert re.fullmatch(r"[0-9a-f]{40}",s); pathlib.Path("candidate-image.json").write_text(json.dumps({"source_sha":s,"digest":d,"run_id":os.environ["BUILD_RUN"]},indent=2)); print("Verified candidate digest",d)'
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-image
          path: candidate-image.json
          if-no-files-found: error
