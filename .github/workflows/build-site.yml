name: SportsClaw Site Build

on:
  push:
    tags:
      - "v*.*.*"
  # Site-only deploys without cutting an engine release (image tag: site-<sha>).
  workflow_dispatch:

env:
  APP_NAME: sportsclaw-site
  AKS_CLUSTER_NAME: mks-community-cluster
  AKS_RESOURCE_GROUP: mks-community-group
  DEPLOYMENT_NAME: sportsclaw-site-deployment
  CONTAINER_NAME: sportsclaw-site
  NAMESPACE: default

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Git
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag name as release version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "RELEASE_NAME=site-${GITHUB_SHA}" >> $GITHUB_ENV
          else
            echo "RELEASE_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site (VitePress)
        env:
          # Contributor and PR counts on the landing page (best-effort; a failed
          # fetch falls back to the snapshot in docs/.vitepress/theme/project.data.ts).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # install.sh is served at /install.sh — stage it into VitePress public/
          # before the build so it lands in the dist root.
          cp scripts/install.sh docs/public/install.sh
          npm install --no-audit --no-fund
          npm run docs:build
          # Fail loudly if the build produced nothing — otherwise the Docker
          # COPY below would ship an empty site and nginx would 404 everything.
          if [ ! -d docs/.vitepress/dist ] || [ -z "$(ls -A docs/.vitepress/dist)" ]; then
            echo "::error::VitePress build produced no output (docs/.vitepress/dist empty)"
            exit 1
          fi
          rm -rf site/html
          mkdir -p site/html
          cp -r docs/.vitepress/dist/. site/html/

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./site
          file: ./site/Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/${{ env.APP_NAME }}:${{ env.RELEASE_NAME }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        uses: azure/aks-set-context@v4
        with:
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}

      - name: Deploy to AKS
        run: |
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} ${{ env.CONTAINER_NAME }}=${{ secrets.REGISTRY_URL }}/${{ env.APP_NAME }}:${{ env.RELEASE_NAME }} -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}
